{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block barra %}{% endblock %}

{% block conteudo %}
<div class="acesso">
  <img class="acesso__logo" src="{{ url_for('static', filename='img/logo.png') }}"
       alt="Rota do Blush – Maquiagem Home Care">
  <h1 class="titulo">Criar conta</h1>
  <p class="subtitulo">Cadastre-se para agendar sua make em casa.</p>

  <form class="formulario" method="post">
    <label class="campo">
      <span>Nome</span>
      <input type="text" name="nome" value="{{ dados.get('nome', '') }}" autocomplete="name" minlength="3" required>
    </label>
    <label class="campo">
      <span>Telefone (WhatsApp)</span>
      <input type="tel" name="telefone" value="{{ dados.get('telefone', '') }}" placeholder="(63) 99999-0000" autocomplete="tel" required>
    </label>
    <label class="campo">
      <span>Email</span>
      <input type="email" name="email" value="{{ dados.get('email', '') }}" autocomplete="email" required>
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" name="senha" autocomplete="new-password" minlength="6" required>
    </label>
        <h2 class="secao__titulo formulario__secao">Endereço do atendimento</h2>
    <label class="campo">
      <span>CEP</span>
      <input type="text" name="cep" id="cep" value="{{ dados.get('cep', '') }}"
             placeholder="77800-000" inputmode="numeric" maxlength="9"
             autocomplete="postal-code" required>
      <small class="campo__ajuda" id="cep-status" aria-live="polite">Atendemos Araguaína e região (TO).</small>
    </label>
    <label class="campo">
      <span>Rua</span>
      <input type="text" name="rua" id="rua" value="{{ dados.get('rua', '') }}"
             autocomplete="address-line1" required>
    </label>
    <div class="campos-lado">
      <label class="campo">
        <span>Número</span>
        <input type="text" name="numero" id="numero" value="{{ dados.get('numero', '') }}"
               maxlength="10" required>
      </label>
      <label class="campo">
        <span>Bairro</span>
        <input type="text" name="bairro" id="bairro" value="{{ dados.get('bairro', '') }}" required>
      </label>
    </div>
    <label class="campo">
      <span>Cidade</span>
      <input type="text" name="cidade" id="cidade" value="{{ dados.get('cidade', '') }}"
             autocomplete="address-level2" required>
    </label>
    <button class="botao" type="submit">Criar conta</button>
  </form>

  <p class="acesso__link">Já tem conta?
    <a href="{{ url_for('auth.login') }}">Já tenho conta</a></p>
</div>
{% endblock %}
