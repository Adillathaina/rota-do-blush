{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block barra %}{% endblock %}

{% block conteudo %}
<div class="acesso">
  <img class="acesso__logo" src="{{ url_for('static', filename='img/logo.png') }}"
       alt="Rota do Blush – Maquiagem Home Care">
  <h1 class="titulo">Entrar</h1>
  <p class="subtitulo">Acesse sua conta para agendar sua make.</p>

  <form class="formulario" method="post">
    <label class="campo">
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required>
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button class="botao" type="submit">Entrar</button>
  </form>

  <p class="acesso__link">Ainda não tem conta?
    <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
</div>
{% endblock %}
