{% macro icone(nome, tamanho=22) -%}
<svg width="{{ tamanho }}" height="{{ tamanho }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
  {%- if nome == "casa" %}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
  {%- elif nome == "calendario" %}
  <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
  {%- elif nome == "usuario" %}
  <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {%- elif nome == "busca" %}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
  {%- elif nome == "voltar" %}
  <path d="m15 18-6-6 6-6"/>
  {%- elif nome == "seta" %}
  <path d="m9 18 6-6-6-6"/>
  {%- elif nome == "brilho" %}
  <path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>
  {%- elif nome == "aliancas" %}
  <circle cx="9" cy="14" r="5"/><circle cx="15" cy="14" r="5"/>
  {%- elif nome == "pincel" %}
  <path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-2 0-4 1.5-4 4 0 1.5-1 2.5-2 3 4 1 8-1 8-5"/>
  {%- elif nome == "capelo" %}
  <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/><path d="M22 9v5"/>
  {%- endif %}
</svg>
{%- endmacro %}
